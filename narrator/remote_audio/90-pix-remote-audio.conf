# Pix speaker and mic live on Harry's laptop: these two virtual devices are piped to it over SSH.
# Remove this file and restart pipewire to undo.
context.modules = [
  { name = libpipewire-module-pipe-tunnel
    args = { tunnel.mode = sink pipe.filename = "/tmp/pix-speaker"
             audio.format = S16LE audio.rate = 22050 audio.channels = 1 audio.position = [ MONO ]
             stream.props = { node.name = "pix_speaker" node.description = "Pix speaker (remote)" } } }
  { name = libpipewire-module-pipe-tunnel
    args = { tunnel.mode = source pipe.filename = "/tmp/pix-mic"
             audio.format = S16LE audio.rate = 16000 audio.channels = 1 audio.position = [ MONO ]
             stream.props = { node.name = "pix_mic" node.description = "Pix mic (remote)" } } }
]
