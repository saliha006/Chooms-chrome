# One entry per role; the policy and the inspector share each stream (F13).
# path: /dev/v4l/by-id/... on the Intel laptop (`ls /dev/v4l/by-id/`), or an index for local tests.
# view: the DefectSignal.view name for frames from this camera.
# fourcc (optional): pixel format to ask for, when a camera streams nothing in its default.
top:
  path: /dev/v4l/by-id/usb-Intel_R__RealSense_TM__Depth_Camera_415_Intel_R__RealSense_TM__Depth_Camera_415_310323024442-video-index0       # the RealSense D415 colour stream (YUYV; index2 is infrared), looking down: its depth sees tall things in the zone (F9, F18)
  view: realsense
inspect:
  path: /dev/v4l/by-id/usb-Webcam_Webcam_Audio_01.00.00-video-index0       # the webcam at the inspection mark
  view: webcam
wrist:
  path: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB2.0_CAM1_USB2.0_CAM1-video-index0   # gripper camera, looks past the jaws
  view: wrist
  fourcc: MJPG     # gives no frames in its default YUYV (Nate, 17:43); Nate records it in MJPG too
