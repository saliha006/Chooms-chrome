# ElevenLabs voice IDs (not secret). decisions.md D12, D13.
calm: etWmxTqEKhIYyGKMpDcb     # standard conversational; open to change
cowboy: 0hh7H4ZVAtaGpm1VZyEN   # David, deep southern cowboy
live_model: eleven_flash_v2_5
cached_model: eleven_multilingual_v2   # fixed clips; eleven_v3 is more expressive if the account has it
